{% extends 'storefront/catalog_base.html' %}
{% block content %}
<div class="mx-auto flex min-h-screen max-w-2xl items-center px-5 py-12 pt-24 sm:px-6">
    <section class="neo-panel w-full bg-[var(--sf-surface)] p-6 sm:p-8">
        <p class="text-xs font-black uppercase tracking-[0.18em] text-[var(--sf-muted)]">Lhie Store</p>
        <h1 class="mt-3 font-display text-3xl font-black leading-tight sm:text-4xl">{{ title }}</h1>
        <p class="mt-4 text-sm font-semibold leading-7 text-[var(--sf-muted)]">{{ message }}</p>
        <a class="neo-button mt-7 inline-flex min-h-12 items-center justify-center px-5" href="/">Kembali ke katalog</a>
    </section>
</div>
{% endblock %}
