<!doctype html>
<!-- THROWAWAY PROTOTYPE: tiga struktur dashboard, ?variant=A/B/C. Data fiktif, tanpa backend. Run: python -m http.server 8765 --bind 127.0.0.1 --directory src/resources/views/admin/dashboard-prototype -->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype Dashboard — bukan produksi</title>
    <link rel="stylesheet" href="prototype.css" />

    <div id="app"></div>
    <aside class="switcher" aria-label="Pilihan prototype">
