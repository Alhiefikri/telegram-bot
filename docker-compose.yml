x-app-environment: &app-environment
  APP_NAME: LHIE STORE
  APP_ENV: ${APP_ENV:-production}
  APP_ALLOW_NON_PRODUCTION_DOCKER: ${APP_ALLOW_NON_PRODUCTION_DOCKER:-false}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_FORCE_HTTPS: "true"
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  LOG_CHANNEL: stack
  LOG_STACK: daily
  LOG_LEVEL: info
  LOG_DAILY_DAYS: 14
  LOG_DEPRECATIONS_CHANNEL: null
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
  APP_OPTIMIZE: "true"
  APP_AUTO_SET_TELEGRAM_WEBHOOK: "false"
  CREDENTIAL_IDENTITY_FINGERPRINT_KEY: ${CREDENTIAL_IDENTITY_FINGERPRINT_KEY:-}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: telegram_bot
  DB_USERNAME: telegram_bot
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_QUEUE_RETRY_AFTER: 180
  FILESYSTEM_DISK: local
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-LHIE STORE}
  ADMIN_ALLOWED_LOGINS: ${ADMIN_ALLOWED_LOGINS:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
  TELEGRAM_ADMIN_USER_ID: ${TELEGRAM_ADMIN_USER_ID:-}
  BINANCE_PAY_ID: ${BINANCE_PAY_ID:-}
  BINANCE_PAY_UID: ${BINANCE_PAY_UID:-}
  BINANCE_API_KEY: ${BINANCE_API_KEY:-}
  BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
  # Optional BSC provider override; the public endpoints pinned in the
  # application are used as ordered fallbacks when this is empty.
  BSC_RPC_URL: ${BSC_RPC_URL:-}
  PAKASIR_SLUG: ${PAKASIR_SLUG:-}
  PAKASIR_API_KEY: ${PAKASIR_API_KEY:-}
  KLIKQRIS_SANDBOX_API_KEY: ${KLIKQRIS_SANDBOX_API_KEY:-}
  KLIKQRIS_SANDBOX_MERCHANT_ID: ${KLIKQRIS_SANDBOX_MERCHANT_ID:-}
  KLIKQRIS_PRODUCTION_API_KEY: ${KLIKQRIS_PRODUCTION_API_KEY:-}
  KLIKQRIS_PRODUCTION_MERCHANT_ID: ${KLIKQRIS_PRODUCTION_MERCHANT_ID:-}
  SAKURUPIAH_SANDBOX_API_ID: ${SAKURUPIAH_SANDBOX_API_ID:-}
  SAKURUPIAH_SANDBOX_API_KEY: ${SAKURUPIAH_SANDBOX_API_KEY:-}
  SAKURUPIAH_PRODUCTION_API_ID: ${SAKURUPIAH_PRODUCTION_API_ID:-}
  SAKURUPIAH_PRODUCTION_API_KEY: ${SAKURUPIAH_PRODUCTION_API_KEY:-}
  STOREFRONT_WAITLIST_HASH_KEY: ${STOREFRONT_WAITLIST_HASH_KEY:-}

services:
  app:
    image: ${APP_IMAGE:-telegram-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_AUTO_MIGRATE: "false"
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan ops:health --db --queue-schema --queue-depth --supervisor --image-pipeline >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "1.50"
    mem_limit: 896m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_public:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "0.35"
    mem_limit: 160m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  scheduler:
    image: ${APP_IMAGE:-telegram-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/usr/local/bin/docker-scheduler-laravel"]
    environment:
      <<: *app-environment
      APP_AUTO_MIGRATE: "false"
      APP_AUTO_SET_TELEGRAM_WEBHOOK: "false"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan ops:health --scheduler-heartbeat=180 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    cpus: "0.35"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  outbound-recovery:
    image: ${APP_IMAGE:-telegram-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/usr/local/bin/docker-outbound-recovery-laravel"]
    environment:
      <<: *app-environment
      APP_AUTO_MIGRATE: "false"
      APP_AUTO_SET_TELEGRAM_WEBHOOK: "false"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan ops:health --outbound-recovery-heartbeat=180 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    cpus: "0.35"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Preserve queue payloads under pressure; failed writes are visible, not silently evicted.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "0.25"
    mem_limit: 128m
    # The upstream image declares /data as a volume; tmpfs prevents an implicit anonymous persistent volume.
    tmpfs:
      - /data:size=1m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network


  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_parameter_max_length=0
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - max_connections=32
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_bot}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "1.00"
    mem_limit: 896m
    shm_size: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
  laravel_storage:
  laravel_public:
