  BINANCE_HISTORY_MAX_WINDOW_SPLITS: ${BINANCE_HISTORY_MAX_WINDOW_SPLITS:-8}
  BINANCE_HISTORY_MAX_DURATION_SECONDS: ${BINANCE_HISTORY_MAX_DURATION_SECONDS:-45}
  BINANCE_VERIFY_CLOCK_SKEW_SECONDS: ${BINANCE_VERIFY_CLOCK_SKEW_SECONDS:-0}
  BINANCE_VERIFY_RATE_LIMIT_ATTEMPTS: ${BINANCE_VERIFY_RATE_LIMIT_ATTEMPTS:-5}
  BINANCE_VERIFY_RATE_LIMIT_DECAY_SECONDS: ${BINANCE_VERIFY_RATE_LIMIT_DECAY_SECONDS:-300}
  TELEGRAM_ADMIN_CONTACT_URL: ${TELEGRAM_ADMIN_CONTACT_URL:-}
  TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
  TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
  TELEGRAM_WEBHOOK_RATE_LIMIT_PER_MINUTE: ${TELEGRAM_WEBHOOK_RATE_LIMIT_PER_MINUTE:-120}
  TELEGRAM_WELCOME_BANNER_URL: ${TELEGRAM_WELCOME_BANNER_URL:-}
  TELEGRAM_PRODUCT_CUSTOM_EMOJI_ENABLED: ${TELEGRAM_PRODUCT_CUSTOM_EMOJI_ENABLED:-true}
  TG_ICON_CHATGPT: ${TG_ICON_CHATGPT:-}
  TG_ICON_GEMINI: ${TG_ICON_GEMINI:-}
  TG_ICON_GROK: ${TG_ICON_GROK:-}
  TG_ICON_CAPCUT: ${TG_ICON_CAPCUT:-}
  TG_ICON_ADOBE: ${TG_ICON_ADOBE:-}
  TG_ICON_CURSOR: ${TG_ICON_CURSOR:-}
  TG_ICON_YOUTUBE: ${TG_ICON_YOUTUBE:-}
  TG_ICON_KLING: ${TG_ICON_KLING:-}
  TG_ICON_LOVABLE: ${TG_ICON_LOVABLE:-}
  TG_ICON_NOTION: ${TG_ICON_NOTION:-}
  PAKASIR_SLUG: ${PAKASIR_SLUG:-}
  PAKASIR_API_KEY: ${PAKASIR_API_KEY:-}
  PAKASIR_BASE_URL: ${PAKASIR_BASE_URL:-https://app.pakasir.com}
  PAKASIR_HTTP_TIMEOUT_SECONDS: ${PAKASIR_HTTP_TIMEOUT_SECONDS:-10}
  PAKASIR_HTTP_CONNECT_TIMEOUT_SECONDS: ${PAKASIR_HTTP_CONNECT_TIMEOUT_SECONDS:-3}
  PAKASIR_TRANSACTION_DETAIL_MAX_ATTEMPTS: ${PAKASIR_TRANSACTION_DETAIL_MAX_ATTEMPTS:-3}
  PAKASIR_TRANSACTION_DETAIL_RETRY_DELAY_MS: ${PAKASIR_TRANSACTION_DETAIL_RETRY_DELAY_MS:-250}
  PAKASIR_TRANSACTION_DETAIL_RETRY_MAX_DELAY_MS: ${PAKASIR_TRANSACTION_DETAIL_RETRY_MAX_DELAY_MS:-1000}
  PAKASIR_REDIRECT_URL: ${PAKASIR_REDIRECT_URL:-}
  PAKASIR_QRIS_FEE_PAYER: ${PAKASIR_QRIS_FEE_PAYER:-customer}
  PAKASIR_QRIS_FEE_THRESHOLD: ${PAKASIR_QRIS_FEE_THRESHOLD:-105000}
  PAKASIR_QRIS_FEE_LOW_BPS: ${PAKASIR_QRIS_FEE_LOW_BPS:-70}
  PAKASIR_QRIS_FEE_LOW_FIXED: ${PAKASIR_QRIS_FEE_LOW_FIXED:-310}
  PAKASIR_QRIS_FEE_HIGH_BPS: ${PAKASIR_QRIS_FEE_HIGH_BPS:-100}
  PAKASIR_QRIS_FEE_HIGH_FIXED: ${PAKASIR_QRIS_FEE_HIGH_FIXED:-0}
  LARAVEL_UPDATE_WORKER_PROCESSES: ${LARAVEL_UPDATE_WORKER_PROCESSES:-1}
  LARAVEL_OUTBOUND_WORKER_PROCESSES: ${LARAVEL_OUTBOUND_WORKER_PROCESSES:-1}
  LARAVEL_NOTIFICATION_WORKER_PROCESSES: ${LARAVEL_NOTIFICATION_WORKER_PROCESSES:-1}
  LARAVEL_BROADCAST_WORKER_PROCESSES: ${LARAVEL_BROADCAST_WORKER_PROCESSES:-1}
  LARAVEL_BINANCE_VERIFICATION_WORKER_PROCESSES: ${LARAVEL_BINANCE_VERIFICATION_WORKER_PROCESSES:-1}

services:
  app:
    image: ${APP_IMAGE:-telegram-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      APP_AUTO_MIGRATE: "false"
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan ops:health --db --queue-schema --queue-depth --supervisor >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "1.00"
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_public:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "0.25"
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  scheduler:
    image: ${APP_IMAGE:-telegram-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/usr/local/bin/docker-scheduler-laravel"]
    environment:
      <<: *app-environment
      APP_AUTO_MIGRATE: "false"
      APP_AUTO_SET_TELEGRAM_WEBHOOK: "false"
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan ops:health --scheduler-heartbeat=180 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    cpus: "0.25"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_bot}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "0.75"
    mem_limit: 768m
    shm_size: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
  laravel_storage:
  laravel_public:
