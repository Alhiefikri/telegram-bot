name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit SHA to deploy; defaults to the dispatched main revision.
        required: false
        default: ''
        type: string
      recover_failed_telegram_updates:
        description: Recover failed ProcessTelegramUpdate jobs after the deployment starts healthy.
        required: false
        default: false
        type: boolean
      apply_telegram_outbound_contract:
        description: Apply the destructive Telegram outbound contract migration after verified backup and strict preflight.
        required: false
        default: false
        type: boolean
      bootstrap_local_rollback_image:
        description: "One-time bootstrap only: use the running container's local content-addressed image ID as rollback when production still uses a legacy mutable tag."
        required: false
        default: false
        type: boolean
      initialize_credential_fingerprint_key:
        description: Generate the production credential identity fingerprint key directly on the VPS only when it is missing.
        required: false
        default: false
        type: boolean
      use_persisted_credential_fingerprint_key:
        description: Remove the CREDENTIAL_IDENTITY_FINGERPRINT_KEY override so production uses its existing persisted identity key.
        required: false
        default: false
        type: boolean
      expected_app_url:
        description: Optional canonical APP_URL override for this deploy; defaults to PRODUCTION_APP_URL variable.
        required: false
        default: ''
        type: string


env:
  DEPLOY_BRANCH: main
  DEPLOY_SHA: ${{ inputs.commit || github.sha }}
  COMPOSE_PROJECT_NAME: telegram-bot-prod

permissions:
  actions: read
  contents: read
  packages: read
  statuses: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release gate
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.commit || github.sha }}
    outputs:
      image_reference: ${{ steps.production-image.outputs.reference }}
    steps:
      - name: Require manual deploy from main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "${DEPLOY_BRANCH}" ]; then
            echo "Production deploy must be run manually with --ref ${DEPLOY_BRANCH}. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          case "$TARGET_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Deployment commit must be a full lowercase SHA: $TARGET_SHA"; exit 1 ;;
          esac

      - name: Require successful CI for deployment commit
        id: successful-ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${DEPLOY_BRANCH}" --jq '.status')"
          case "$main_status" in
            identical|ahead) ;;
            *) echo "Deployment commit $TARGET_SHA is not contained in ${DEPLOY_BRANCH}."; exit 1 ;;
          esac

          ci_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=completed&event=push&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | .[0].id // empty')"
          if [ -z "$ci_run_id" ]; then
            echo "CI has not succeeded for deployment commit $TARGET_SHA. Push the commit to ${DEPLOY_BRANCH} and wait for CI."
            exit 1
          fi

          ci_run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}" --jq '.head_sha')"
          ci_run_branch="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}" --jq '.head_branch')"
          ci_run_url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}" --jq '.html_url')"
          [ "$ci_run_sha" = "$TARGET_SHA" ] || {
            echo "Selected CI run $ci_run_id is for $ci_run_sha, not $TARGET_SHA." >&2
            exit 1
          }
          [ "$ci_run_branch" = "$DEPLOY_BRANCH" ] || {
            echo "Selected CI run $ci_run_id is not a ${DEPLOY_BRANCH} run." >&2
            exit 1
          }

          echo "Using successful CI run $ci_run_id for $TARGET_SHA."
          echo "run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$ci_run_url" >> "$GITHUB_OUTPUT"

      - name: Resolve the CI-approved immutable image
        id: production-image
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.successful-ci.outputs.run_id }}
          CI_RUN_URL: ${{ steps.successful-ci.outputs.run_url }}
        run: |
          set -euo pipefail
          statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses")"
          digest="$(printf '%s' "$statuses" | jq -r --arg target_url "$CI_RUN_URL" '
            [.[] | select(.context == "production-image" and .state == "success" and .target_url == $target_url)]
            | .[0].description // empty
          ')"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "CI run $CI_RUN_ID did not record a valid bound production image digest for $TARGET_SHA." >&2
            exit 1
          fi

          image_repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_reference="${image_repository}@${digest}"

          echo "reference=$image_reference" >> "$GITHUB_OUTPUT"
          echo "Deploying CI-approved image: $image_reference"
          {
            echo "### Approved production image"
            echo
            echo "- Commit: \`${TARGET_SHA}\`"
            echo "- CI run: \`${CI_RUN_ID}\`"
            echo "- Immutable reference: \`${image_reference}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production VPS
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 45
    needs: release-gate
    environment: production
    env:
      RELEASE_ARTIFACT_DIR: .release-gate-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
      APP_IMAGE: ${{ needs.release-gate.outputs.image_reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_HOST:?Missing GitHub secret PRODUCTION_HOST}"
          : "${PRODUCTION_SSH_PRIVATE_KEY:?Missing GitHub secret PRODUCTION_SSH_PRIVATE_KEY}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -p "$PRODUCTION_SSH_PORT" -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Authenticate VPS Docker to GHCR for this release
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | ssh -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
                "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin >/dev/null"
      - name: Deploy over SSH
        id: remote-deploy
        continue-on-error: true
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          RECOVER_FAILED_TELEGRAM_UPDATES: ${{ inputs.recover_failed_telegram_updates }}
          BOOTSTRAP_LOCAL_ROLLBACK_IMAGE: ${{ inputs.bootstrap_local_rollback_image }}
          INITIALIZE_CREDENTIAL_FINGERPRINT_KEY: ${{ inputs.initialize_credential_fingerprint_key }}
          USE_PERSISTED_CREDENTIAL_FINGERPRINT_KEY: ${{ inputs.use_persisted_credential_fingerprint_key }}
          RELEASE_ARTIFACT_DIR: ${{ env.RELEASE_ARTIFACT_DIR }}
          APP_IMAGE: ${{ env.APP_IMAGE }}
          EXPECTED_APP_URL: ${{ inputs.expected_app_url || vars.PRODUCTION_APP_URL }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_USER:?Missing GitHub secret PRODUCTION_USER}"
          : "${PRODUCTION_PATH:?Missing GitHub secret PRODUCTION_PATH}"
          : "${EXPECTED_APP_URL:?Set the non-secret production environment variable PRODUCTION_APP_URL to the canonical APP_URL}"

          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            PRODUCTION_PATH="$PRODUCTION_PATH" DEPLOY_BRANCH="$DEPLOY_BRANCH" DEPLOY_SHA="$DEPLOY_SHA" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" RECOVER_FAILED_TELEGRAM_UPDATES="$RECOVER_FAILED_TELEGRAM_UPDATES" BOOTSTRAP_LOCAL_ROLLBACK_IMAGE="$BOOTSTRAP_LOCAL_ROLLBACK_IMAGE" INITIALIZE_CREDENTIAL_FINGERPRINT_KEY="$INITIALIZE_CREDENTIAL_FINGERPRINT_KEY" USE_PERSISTED_CREDENTIAL_FINGERPRINT_KEY="$USE_PERSISTED_CREDENTIAL_FINGERPRINT_KEY" RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" APP_IMAGE="$APP_IMAGE" EXPECTED_APP_URL="$EXPECTED_APP_URL" \
            'bash -s' < scripts/deploy-production-release.sh

      - name: Reconcile remote release state
        id: remote-reconcile
        if: always()
        continue-on-error: true
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          RELEASE_ARTIFACT_DIR: ${{ env.RELEASE_ARTIFACT_DIR }}
          APP_IMAGE: ${{ env.APP_IMAGE }}
          EXPECTED_APP_URL: ${{ inputs.expected_app_url || vars.PRODUCTION_APP_URL }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_USER:?Missing GitHub secret PRODUCTION_USER}"
          : "${PRODUCTION_PATH:?Missing GitHub secret PRODUCTION_PATH}"

          reconcile_output="$(
            ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
              PRODUCTION_PATH="$PRODUCTION_PATH" DEPLOY_SHA="$DEPLOY_SHA" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" RELEASE_OPERATION=reconcile APP_IMAGE="$APP_IMAGE" EXPECTED_APP_URL="$EXPECTED_APP_URL" \
              'bash -s' < scripts/deploy-production-release.sh | tee /dev/stderr
          )"
          if printf '%s\n' "$reconcile_output" | grep -Fqx 'RELEASE_RECONCILIATION_STATE=rollback-succeeded'; then
            echo "release_state=rollback-succeeded" >> "$GITHUB_OUTPUT"
          fi
      - name: Run external public smoke checks
        id: external-smoke
        if: steps.remote-reconcile.outcome == 'success' && steps.remote-reconcile.outputs.release_state != 'rollback-succeeded'
        continue-on-error: true
        env:
          BASE_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL }}
          EXPECTED_APP_URL: ${{ inputs.expected_app_url || vars.PRODUCTION_APP_URL }}
          EXPECTED_RELEASE_SHA: ${{ env.DEPLOY_SHA }}
          SMOKE_HEALTH_MARKER: 'Application up'
          SMOKE_ADMIN_MARKER: 'LHIE STORE'
          SMOKE_TIMEOUT: '15'
          SMOKE_PUBLIC_ONLY: 'true'
        run: |
          set -euo pipefail
          : "${BASE_URL:?Set the non-secret production environment variable PRODUCTION_SMOKE_BASE_URL}"
          : "${EXPECTED_APP_URL:?Set the non-secret production environment variable PRODUCTION_APP_URL to the canonical APP_URL}"
          ./scripts/smoke-production.sh

      - name: Roll back after external smoke failure
        id: external-smoke-rollback
        if: steps.remote-reconcile.outcome == 'success' && steps.external-smoke.outcome == 'failure'
        continue-on-error: true
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          RELEASE_ARTIFACT_DIR: ${{ env.RELEASE_ARTIFACT_DIR }}
          EXPECTED_APP_URL: ${{ inputs.expected_app_url || vars.PRODUCTION_APP_URL }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            PRODUCTION_PATH="$PRODUCTION_PATH" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" RELEASE_OPERATION=rollback FAILURE_REASON=external-smoke-failed EXPECTED_APP_URL="$EXPECTED_APP_URL" \
            'bash -s' < scripts/deploy-production-release.sh
      - name: Capture rollback release identity
        id: rollback-identity
        if: always() && steps.external-smoke.outcome == 'failure' && steps.external-smoke-rollback.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          RELEASE_ARTIFACT_DIR: ${{ env.RELEASE_ARTIFACT_DIR }}
        run: |
          set -euo pipefail
          rollback_sha="$(ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cat '$PRODUCTION_PATH/$RELEASE_ARTIFACT_DIR/previous-commit.txt'")"
          [[ "$rollback_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Rollback release identity is invalid." >&2
            exit 1
          }
          echo "sha=$rollback_sha" >> "$GITHUB_OUTPUT"

      - name: Re-run external public smoke after rollback
        id: rollback-external-smoke
        if: always() && steps.external-smoke.outcome == 'failure' && steps.external-smoke-rollback.outcome == 'success' && steps.rollback-identity.outcome == 'success'
        continue-on-error: true
        env:
          BASE_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL }}
          EXPECTED_APP_URL: ${{ inputs.expected_app_url || vars.PRODUCTION_APP_URL }}
          EXPECTED_RELEASE_SHA: ${{ steps.rollback-identity.outputs.sha }}
          SMOKE_HEALTH_MARKER: 'Application up'
          SMOKE_ADMIN_MARKER: 'LHIE STORE'
          SMOKE_TIMEOUT: '15'
          SMOKE_PUBLIC_ONLY: 'true'
        run: |
          set -euo pipefail
          ./scripts/smoke-production.sh


      - name: Apply deferred Telegram outbound contract
        id: telegram-outbound-contract
        if: steps.remote-reconcile.outcome == 'success' && steps.external-smoke.outcome == 'success' && inputs.apply_telegram_outbound_contract == true
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          RELEASE_ARTIFACT_DIR: ${{ env.RELEASE_ARTIFACT_DIR }}
          APP_IMAGE: ${{ env.APP_IMAGE }}
          EXPECTED_APP_URL: ${{ inputs.expected_app_url || vars.PRODUCTION_APP_URL }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_USER:?Missing GitHub secret PRODUCTION_USER}"
          : "${PRODUCTION_PATH:?Missing GitHub secret PRODUCTION_PATH}"

          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            PRODUCTION_PATH="$PRODUCTION_PATH" DEPLOY_SHA="$DEPLOY_SHA" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" RELEASE_OPERATION=contract APP_IMAGE="$APP_IMAGE" EXPECTED_APP_URL="$EXPECTED_APP_URL" \
            'bash -s' < scripts/deploy-production-release.sh


      - name: Fail release after remote-state reconciliation failure
        if: always() && steps.remote-reconcile.outcome == 'failure'
        run: |
          echo "Remote deployment state could not prove a healthy candidate or a healthy rollback. Inspect release-state.env and release-result.txt in the diagnostics." >&2
          exit 22

      - name: Fail release after external smoke rollback
        if: always() && steps.external-smoke.outcome == 'failure'
        env:
          ROLLBACK_OUTCOME: ${{ steps.external-smoke-rollback.outcome }}
          ROLLBACK_SMOKE_OUTCOME: ${{ steps.rollback-external-smoke.outcome }}
        run: |
          if [ "$ROLLBACK_OUTCOME" = "success" ] && [ "$ROLLBACK_SMOKE_OUTCOME" = "success" ]; then
            echo "External public smoke failed; rollback restored a healthy previous release and passed public smoke." >&2
            exit 20
          fi
          echo "External public smoke or its rollback verification failed. Emergency manual recovery is required." >&2
          exit 21
      - name: Fail release after healthy automatic rollback
        if: always() && steps.remote-reconcile.outputs.release_state == 'rollback-succeeded'
        run: |
          echo "Candidate release failed, but reconciliation confirmed the previous release is healthy." >&2
          exit 20


      - name: Remove transient GHCR credentials from VPS
        if: always()
        continue-on-error: true
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            'docker logout ghcr.io >/dev/null 2>&1 || true'

      - name: Download release-gate diagnostics
        if: always()
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          set -euo pipefail
          mkdir -p release-gate-artifacts
          scp -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/production_key -P "$PRODUCTION_SSH_PORT" -r \
            "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_PATH/$RELEASE_ARTIFACT_DIR/." release-gate-artifacts/ \
            || printf 'Release-gate diagnostics were unavailable for download.\n' >&2

      - name: Summarize release outcome
        if: always()
        run: |
          result="$(cat release-gate-artifacts/release-result.txt 2>/dev/null || printf 'release-result-unavailable')"
          {
            echo "### Production release outcome"
            echo
            echo "- Result: \`$result\`"
            case "$result" in
              deploy-succeeded-compatible-contract-pending)
                echo "- Compatible candidate is running; the deferred Telegram outbound contract phase has not completed."
                ;;
              contract-failed-candidate-remains)
                echo "- Deferred Telegram outbound contract failed; the compatible candidate remains running and needs manual investigation."
                ;;
              deploy-failed-rollback-succeeded|external-smoke-failed-rollback-succeeded|remote-state-reconcile-rollback-succeeded)
                echo "- Deployment failed, but automatic rollback restored a healthy previous release."
                ;;
              deploy-failed-rollback-failed|external-smoke-failed-rollback-failed|remote-state-reconcile-rollback-failed)
                echo "- Deployment and automatic rollback both failed. Emergency manual recovery is required."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release-gate diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-diagnostics-${{ github.run_id }}
          path: release-gate-artifacts
          if-no-files-found: warn
