name: Deploy production

on:
  workflow_dispatch:

env:
  DEPLOY_BRANCH: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_FORCE_HTTPS: false
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require manual deploy from main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "${DEPLOY_BRANCH}" ]; then
            echo "Production deploy must be run manually with --ref ${DEPLOY_BRANCH}. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Build assets and run tests
        run: |
          ../scripts/smoke-admin-assets.sh
          composer test

      - name: Build production Docker image
        working-directory: ${{ github.workspace }}
        run: docker build --pull -t telegram-bot:${{ github.sha }} .

  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: release-gate
    environment: production
    steps:
      - name: Configure SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_HOST:?Missing GitHub secret PRODUCTION_HOST}"
          : "${PRODUCTION_SSH_PRIVATE_KEY:?Missing GitHub secret PRODUCTION_SSH_PRIVATE_KEY}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -p "$PRODUCTION_SSH_PORT" -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_USER:?Missing GitHub secret PRODUCTION_USER}"
          : "${PRODUCTION_PATH:?Missing GitHub secret PRODUCTION_PATH}"

          ssh -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            PRODUCTION_PATH="$PRODUCTION_PATH" DEPLOY_BRANCH="$DEPLOY_BRANCH" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$PRODUCTION_PATH"

          git fetch --prune origin "$DEPLOY_BRANCH"
          git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          docker compose --env-file .env config >/dev/null
          docker compose --env-file .env up -d --build --remove-orphans

          for attempt in $(seq 1 36); do
            if docker compose --env-file .env exec -T app php artisan ops:health --db --queue-schema --supervisor; then
              break
            fi

            if [ "$attempt" -eq 36 ]; then
              docker compose --env-file .env ps
              docker compose --env-file .env logs --tail=120 app web scheduler
              exit 1
            fi

            sleep 5
          done

          for attempt in $(seq 1 36); do
            if docker compose --env-file .env exec -T scheduler php artisan ops:health --scheduler-heartbeat=180; then
              break
            fi

            if [ "$attempt" -eq 36 ]; then
              docker compose --env-file .env ps
              docker compose --env-file .env logs --tail=120 scheduler
              exit 1
            fi

            sleep 5
          done

          docker compose --env-file .env ps
          REMOTE
