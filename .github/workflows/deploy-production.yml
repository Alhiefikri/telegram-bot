name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit SHA to deploy; defaults to the dispatched main revision.
        required: false
        default: ''
        type: string
      recover_failed_telegram_updates:
        description: Recover failed ProcessTelegramUpdate jobs after the deployment starts healthy.
        required: false
        default: false
        type: boolean


env:
  DEPLOY_BRANCH: main
  DEPLOY_SHA: ${{ inputs.commit || github.sha }}
  COMPOSE_PROJECT_NAME: telegram-bot-prod

permissions:
  actions: read
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Require manual deploy from main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "${DEPLOY_BRANCH}" ]; then
            echo "Production deploy must be run manually with --ref ${DEPLOY_BRANCH}. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

          case "$TARGET_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Deployment commit must be a full lowercase SHA: $TARGET_SHA"; exit 1 ;;
          esac

      - name: Require successful CI for deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${DEPLOY_BRANCH}" --jq '.status')"
          case "$main_status" in
            identical|ahead) ;;
            *) echo "Deployment commit $TARGET_SHA is not contained in ${DEPLOY_BRANCH}."; exit 1 ;;
          esac

          ci_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=completed&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty')"
          if [ -z "$ci_run_id" ]; then
            echo "CI has not succeeded for deployment commit $TARGET_SHA. Push the commit to ${DEPLOY_BRANCH} and wait for CI."
            exit 1
          fi

          echo "Using successful CI run $ci_run_id for $TARGET_SHA."

  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: release-gate
    environment: production
    env:
      RELEASE_ARTIFACT_DIR: .release-gate-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_HOST:?Missing GitHub secret PRODUCTION_HOST}"
          : "${PRODUCTION_SSH_PRIVATE_KEY:?Missing GitHub secret PRODUCTION_SSH_PRIVATE_KEY}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -p "$PRODUCTION_SSH_PORT" -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          RECOVER_FAILED_TELEGRAM_UPDATES: ${{ inputs.recover_failed_telegram_updates }}
          RELEASE_ARTIFACT_DIR: ${{ env.RELEASE_ARTIFACT_DIR }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_USER:?Missing GitHub secret PRODUCTION_USER}"
          : "${PRODUCTION_PATH:?Missing GitHub secret PRODUCTION_PATH}"

          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            PRODUCTION_PATH="$PRODUCTION_PATH" DEPLOY_BRANCH="$DEPLOY_BRANCH" DEPLOY_SHA="$DEPLOY_SHA" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" RECOVER_FAILED_TELEGRAM_UPDATES="$RECOVER_FAILED_TELEGRAM_UPDATES" RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$PRODUCTION_PATH"
          RELEASE_ARTIFACT_DIR="$PRODUCTION_PATH/$RELEASE_ARTIFACT_DIR"
          mkdir -p "$RELEASE_ARTIFACT_DIR"

          collect_release_diagnostics() {
            docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env ps --format json > "$RELEASE_ARTIFACT_DIR/compose-ps.json" 2>/dev/null || true
            docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:release-health-summary --since="$RELEASE_STARTED_AT" > "$RELEASE_ARTIFACT_DIR/health-summary.json" 2>/dev/null || true
            docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env logs --tail=120 app web scheduler 2>&1 \
              | sed -E -e 's/(token|secret|password|app_key)=?[^[:space:]]*/\1=[REDACTED]/Ig' -e 's/bot[0-9]{6,}:[[:alnum:]_-]+/bot[REDACTED]/g' \
              > "$RELEASE_ARTIFACT_DIR/compose.log" || true
          }

          RELEASE_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trap 'status=$?; collect_release_diagnostics; exit "$status"' EXIT
          exec 9>"$PRODUCTION_PATH/.production-mutation.lock"
          if ! flock -n 9; then
            echo "Another production deployment or recovery is already running; refusing to overlap." >&2
            exit 1
          fi
          echo "Acquired production mutation lock."

          git fetch --prune origin "$DEPLOY_BRANCH"
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git checkout --detach "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"

          ./scripts/safe-compose-config.sh --project "$COMPOSE_PROJECT_NAME" --env-file .env
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env build --pull
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env up -d --no-build --remove-orphans

          for attempt in $(seq 1 36); do
            if docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:health --db --queue-schema --supervisor </dev/null; then
              break
            fi

            if [ "$attempt" -eq 36 ]; then
              docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env ps
              docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env logs --tail=120 app web scheduler
              exit 1
            fi

            sleep 5
          done

          for attempt in $(seq 1 36); do
            if docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T scheduler php artisan ops:health --scheduler-heartbeat=180 </dev/null; then
              break
            fi

            if [ "$attempt" -eq 36 ]; then
              docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env ps
              docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env logs --tail=120 scheduler
              exit 1
            fi

            sleep 5
          done

          if [ "$RECOVER_FAILED_TELEGRAM_UPDATES" = "true" ]; then
            docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan telegram:recover-failed-updates --prune-unrecoverable
          fi

          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:check-failed-jobs --max=0 --since="$RELEASE_STARTED_AT" </dev/null
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:check-queue-depth --max=50 --max-oldest-age=120 </dev/null
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:check-telegram-webhook --max-pending=25 --observation-seconds=30 --sample-interval=5 </dev/null

          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env ps

          duplicate_projects="$(
            docker ps --filter label=com.docker.compose.project --format '{{.Label "com.docker.compose.project"}}' \
              | sort -u \
              | awk -v expected="$COMPOSE_PROJECT_NAME" '$0 ~ /^telegram-bot/ && $0 != expected'
          )"

          if [ -n "$duplicate_projects" ]; then
            echo "Unexpected Telegram Bot Compose project(s) running:"
            printf '%s\n' "$duplicate_projects"
            docker ps --filter label=com.docker.compose.project --format 'table {{.Names}}\t{{.Label "com.docker.compose.project"}}\t{{.Status}}\t{{.Ports}}'
            exit 1
          fi

          echo "No duplicate Telegram Bot Compose projects running."
          REMOTE

      - name: Run external public smoke checks
        env:
          BASE_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL }}
          SMOKE_TIMEOUT: '15'
        run: |
          set -euo pipefail
          : "${BASE_URL:?Set the non-secret production environment variable PRODUCTION_SMOKE_BASE_URL}"
          ./scripts/smoke-production.sh

      - name: Download release-gate diagnostics
        if: always()
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          set -euo pipefail
          mkdir -p release-gate-artifacts
          scp -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/production_key -P "$PRODUCTION_SSH_PORT" -r \
            "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_PATH/$RELEASE_ARTIFACT_DIR/." release-gate-artifacts/ \
            || printf 'Release-gate diagnostics were unavailable for download.\n' >&2

      - name: Upload release-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-diagnostics-${{ github.run_id }}
          path: release-gate-artifacts
          if-no-files-found: warn
