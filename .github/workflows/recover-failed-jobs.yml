name: Recover failed jobs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RECOVER_TELEGRAM_UPDATES to recover supported failed Telegram update jobs only.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  recover:
    name: Recover and verify supported failed Telegram update jobs
    if: inputs.confirm == 'RECOVER_TELEGRAM_UPDATES'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      COMPOSE_PROJECT_NAME: telegram-bot-prod
    steps:
      - name: Configure SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_HOST:?Missing GitHub secret PRODUCTION_HOST}"
          : "${PRODUCTION_SSH_PRIVATE_KEY:?Missing GitHub secret PRODUCTION_SSH_PRIVATE_KEY}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -p "$PRODUCTION_SSH_PORT" -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Recover failed Telegram update jobs
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_USER:?Missing GitHub secret PRODUCTION_USER}"
          : "${PRODUCTION_PATH:?Missing GitHub secret PRODUCTION_PATH}"

          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -i ~/.ssh/production_key -p "$PRODUCTION_SSH_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            PRODUCTION_PATH="$PRODUCTION_PATH" COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$PRODUCTION_PATH"
          exec 9>"$PRODUCTION_PATH/.production-mutation.lock"
          if ! flock -n 9; then
            echo "Another production deployment or recovery is already running; refusing to overlap." >&2
            exit 1
          fi
          echo "Acquired production mutation lock."

          ./scripts/safe-compose-config.sh --project "$COMPOSE_PROJECT_NAME" --env-file .env
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan telegram:recover-failed-updates --dry-run
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan telegram:recover-failed-updates --prune-unrecoverable </dev/null

          for attempt in $(seq 1 12); do
            if docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:check-failed-jobs --max=0 </dev/null; then
              docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:check-queue-depth --max=0 </dev/null
              echo "Supported failed Telegram update jobs recovered; no failed jobs remain."
              exit 0
            fi

            sleep 5
          done

          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:check-failed-jobs --max=0 </dev/null
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env exec -T app php artisan ops:check-queue-depth --max=0 </dev/null
          exit 1
          REMOTE
