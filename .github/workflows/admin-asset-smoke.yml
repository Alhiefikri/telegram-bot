name: Admin asset smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admin-asset-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-asset-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Build and verify admin Vite manifest
        run: ../scripts/smoke-admin-assets.sh
        working-directory: src
