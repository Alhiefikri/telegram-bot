name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow validation and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Audit Composer production dependencies
        working-directory: src
        run: composer audit --locked --no-dev --abandoned=fail

      - name: Reject duplicate migration filename prefixes
        run: ./scripts/check-migration-prefixes.sh

      - name: Audit npm dependencies at high severity
        working-directory: src
        run: npm audit --audit-level=high

  application-tests:
    name: Application, browser, and PostgreSQL tests
    runs-on: ubuntu-24.04
    needs: [workflow-security]
    container:
      image: ubuntu:24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: telegram_bot_ci_test
          POSTGRES_USER: telegram_bot_ci
          POSTGRES_PASSWORD: ci-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telegram_bot_ci -d telegram_bot_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_FORCE_HTTPS: false
      POSTGRES_DB: telegram_bot_ci_test
      POSTGRES_USER: telegram_bot_ci
      POSTGRES_PASSWORD: ci-only-not-production
      CONCURRENCY_DB_HOST: postgres
      CONCURRENCY_DB_PORT: 5432
      CONCURRENCY_DB_ADMIN_DATABASE: telegram_bot_ci_test
      CONCURRENCY_DB_ADMIN_USERNAME: telegram_bot_ci
      CONCURRENCY_DB_ADMIN_PASSWORD: ci-only-not-production
      CONCURRENCY_DB_APP_USERNAME: telegram_bot_ci
      CONCURRENCY_DB_APP_PASSWORD: ci-only-not-production
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap setup-php prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo \
            ca-certificates \
            curl \
            zstd

      - name: Set up PHP once for all test lanes
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          # setup-php installs inside the job container instead of a runner tool cache.
          runner: self-hosted
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pcntl, pdo_pgsql, pdo_sqlite, pgsql, posix, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: |
          mkdir -p database
          touch database/database.sqlite
          composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP code style with Pint
        run: ./vendor/bin/pint --test

      - name: Install frontend dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Build and verify admin assets
        working-directory: .
        run: ./scripts/smoke-admin-assets.sh

      - name: Prepare Laravel test environment
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Run parallel SQLite PHPUnit suite
        run: composer test -- --parallel --log-junit junit.xml

      - name: Exercise production release and rollback paths
        working-directory: .
        run: |
          ./scripts/test-deploy-production-release.sh
          ./scripts/test-redact-release-diagnostics.sh
          ./scripts/test-check-migration-prefixes.sh
          ./scripts/test-concurrency-deploy-gate.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run customer browser smoke without rebuilding assets
        run: npx playwright test tests/Browser/admin-dashboard-responsive.spec.js -g "customer checkout"

      - name: Migrate empty PostgreSQL database
        env:
          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: telegram_bot_ci_test
          DB_USERNAME: telegram_bot_ci
          DB_PASSWORD: ci-only-not-production
          DB_URL: ''
        run: |
          set -euo pipefail
          php artisan config:clear --ansi
          mkdir -p ../artifacts/postgres-release
          php artisan migrate:fresh --force --ansi 2>&1 | tee ../artifacts/postgres-release/migrations.log
          php artisan migrate:status --ansi 2>&1 | tee ../artifacts/postgres-release/migration-status.log

      - name: Run production-critical PostgreSQL integration tests
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: telegram_bot_ci_test
          DB_USERNAME: telegram_bot_ci
          DB_PASSWORD: ci-only-not-production
          RUN_CONCURRENCY_TESTS: '1'
        run: |
          set -euo pipefail
          artifact_dir=../artifacts/postgres-release
          set +e
          ./vendor/bin/phpunit \
            --configuration=phpunit.postgres.xml \
            --testsuite="PostgreSQL release integration" \
            --group=postgres-release \
            --fail-on-skipped \
            --log-junit="$artifact_dir/junit.xml" \
            --no-coverage \
            2>&1 | tee "$artifact_dir/phpunit.log"
          phpunit_status="${PIPESTATUS[0]}"
          set -e
          php ../scripts/junit-gate-report.php \
            "PostgreSQL Production-Critical Integration Result" \
            "$artifact_dir/junit.xml" \
            "$phpunit_status" \
            "$artifact_dir/phpunit.log" \
            "$DB_DATABASE" > "$artifact_dir/report.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$artifact_dir/report.md"
          exit "$phpunit_status"

      - name: Run PostgreSQL concurrency deploy gate without skips
        working-directory: .
        env:
          RUN_CONCURRENCY_TESTS: '1'
          CONCURRENCY_GATE_ARTIFACT_DIR: artifacts/postgres-concurrency
        run: ./scripts/concurrency-deploy-gate.sh

      - name: Upload PostgreSQL release evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-release-gate-${{ github.run_attempt }}
          path: |
            artifacts/postgres-release/
            artifacts/postgres-concurrency/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-test-failure-${{ github.run_attempt }}
          path: |
            src/junit.xml
            src/test-results/
            src/playwright-report/
            src/storage/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Build, verify, and publish production image
    runs-on: ubuntu-24.04
    needs: application-tests
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      statuses: write
    env:
      LOCAL_IMAGE_TAG: telegram-bot:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Define commit-addressed image name
        run: |
          set -euo pipefail
          image_repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPOSITORY=$image_repository" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${image_repository}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          name: telegram-bot-production
          keep-state: true
          cache-binary: false
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]

      - name: Build production image once with BuildKit
        id: production-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: ${{ env.LOCAL_IMAGE_TAG }}

      - name: Capture Docker build diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docker-diagnostics
          cat > docker-diagnostics/build-metadata.json <<'JSON'
          ${{ steps.production-build.outputs.metadata }}
          JSON
          docker buildx ls > docker-diagnostics/buildx.txt 2>&1 || true
          docker image inspect "$LOCAL_IMAGE_TAG" > docker-diagnostics/image-inspect.json 2>&1 || true
          docker history --no-trunc "$LOCAL_IMAGE_TAG" > docker-diagnostics/image-history.txt 2>&1 || true

      - name: Verify production container image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh -e APP_ENV=testing -e DB_DATABASE=:memory: "$LOCAL_IMAGE_TAG" -ceu '
            php --version
            php artisan --version
            test -f vendor/autoload.php
            test -f public/build/manifest.json
            test -s public/assets/product-placeholder.svg
            test -x /usr/local/bin/docker-entrypoint-laravel
            test -x /usr/local/bin/docker-scheduler-laravel
          '


      - name: Publish verified image and record immutable digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE_TAG" "$IMAGE_TAG"

          push_succeeded=false
          for push_attempt in 1 2 3; do
            if docker push "$IMAGE_TAG"; then
              push_succeeded=true
              break
            fi

            if [ "$push_attempt" -lt 3 ]; then
              retry_delay=$((push_attempt * 15))
              echo "GHCR push attempt ${push_attempt}/3 failed; retrying in ${retry_delay}s." >&2
              sleep "$retry_delay"
            fi
          done
          [ "$push_succeeded" = true ] \
            || { echo "GHCR push failed after 3 bounded attempts." >&2; exit 1; }

          docker pull "$IMAGE_TAG"

          repository_digest="$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          digest="${repository_digest#*@}"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo "Registry returned an invalid image digest: $digest" >&2; exit 1; }

          immutable_ref="${IMAGE_REPOSITORY}@${digest}"
          printf '%s\n' "$digest" > production-image-digest.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=production-image \
            -f description="$digest" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### Production image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Immutable reference: \`${immutable_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published verified production image: $immutable_ref"

      - name: Upload Docker diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-failure-${{ github.run_attempt }}
          path: docker-diagnostics/
          if-no-files-found: warn
          retention-days: 14
