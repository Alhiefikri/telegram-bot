name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow validation and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Audit Composer production dependencies
        working-directory: src
        run: composer audit --locked --no-dev --abandoned=fail

      - name: Reject duplicate migration filename prefixes
        run: ./scripts/check-migration-prefixes.sh

      - name: Audit npm dependencies at high severity
        working-directory: src
        run: npm audit --audit-level=high

  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_FORCE_HTTPS: false
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP code style with Pint
        run: ./vendor/bin/pint --test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build admin assets for feature tests
        run: npm run build

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Run PHPUnit suite
        run: composer test -- --parallel --log-junit junit.xml

      - name: Upload PHPUnit report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phpunit-failure-${{ github.run_attempt }}
          path: |
            src/junit.xml
            src/storage/logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Exercise production release and rollback paths
        working-directory: .
        run: |
          ./scripts/test-deploy-production-release.sh
          ./scripts/test-redact-release-diagnostics.sh
          ./scripts/test-check-migration-prefixes.sh

  postgres-release-gate:
    name: PostgreSQL migration and concurrency release gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: telegram_bot_ci
          POSTGRES_USER: telegram_bot_ci
          POSTGRES_PASSWORD: ci-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telegram_bot_ci -d telegram_bot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_FORCE_HTTPS: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: telegram_bot_ci
      DB_USERNAME: telegram_bot_ci
      DB_PASSWORD: ci-only-not-production
      DB_URL: ''
      POSTGRES_DB: telegram_bot_ci
      POSTGRES_USER: telegram_bot_ci
      POSTGRES_PASSWORD: ci-only-not-production
      CONCURRENCY_DB_HOST: 127.0.0.1
      CONCURRENCY_DB_PORT: 5432
      CONCURRENCY_DB_ADMIN_DATABASE: telegram_bot_ci
      CONCURRENCY_DB_ADMIN_USERNAME: telegram_bot_ci
      CONCURRENCY_DB_ADMIN_PASSWORD: ci-only-not-production
      CONCURRENCY_DB_APP_USERNAME: telegram_bot_ci
      CONCURRENCY_DB_APP_PASSWORD: ci-only-not-production
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP with PostgreSQL and process extensions
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pcntl, pdo_pgsql, pgsql, posix, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for PostgreSQL integration tests
        run: npm run build

      - name: Prepare Laravel PostgreSQL test environment
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache
          php artisan config:clear --ansi

      - name: Migrate empty PostgreSQL database
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/postgres-release
          php artisan migrate:fresh --force --ansi 2>&1 | tee ../artifacts/postgres-release/migrations.log
          php artisan migrate:status --ansi 2>&1 | tee ../artifacts/postgres-release/migration-status.log

      - name: Run production-critical PostgreSQL integration tests
        run: |
          set -euo pipefail
          artifact_dir=../artifacts/postgres-release
          set +e
          ./vendor/bin/phpunit \
            --configuration=phpunit.postgres.xml \
            --testsuite="PostgreSQL release integration" \
            --group=postgres-release \
            --fail-on-skipped \
            --log-junit="$artifact_dir/junit.xml" \
            --no-coverage \
            2>&1 | tee "$artifact_dir/phpunit.log"
          phpunit_status="${PIPESTATUS[0]}"
          set -e
          php ../scripts/junit-gate-report.php \
            "PostgreSQL Production-Critical Integration Result" \
            "$artifact_dir/junit.xml" \
            "$phpunit_status" \
            "$artifact_dir/phpunit.log" \
            "$DB_DATABASE" > "$artifact_dir/report.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$artifact_dir/report.md"
          exit "$phpunit_status"

      - name: Run PostgreSQL concurrency deploy gate without skips
        working-directory: .
        env:
          RUN_CONCURRENCY_TESTS: '1'
          CONCURRENCY_GATE_ARTIFACT_DIR: artifacts/postgres-concurrency
        run: ./scripts/concurrency-deploy-gate.sh

      - name: Upload PostgreSQL release evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-release-gate-${{ github.run_attempt }}
          path: |
            artifacts/postgres-release/
            artifacts/postgres-concurrency/
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: Frontend build and asset smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Build and verify admin Vite manifest
        working-directory: src
        run: ../scripts/smoke-admin-assets.sh

  customer-browser-smoke:
    name: Customer browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_FORCE_HTTPS: false
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare Laravel browser environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Run customer browser smoke
        run: npm run test:browser:customer

      - name: Upload Playwright diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            src/test-results/
            src/playwright-report/
            src/storage/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Build, verify, and publish production image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      statuses: write
    env:
      LOCAL_IMAGE_TAG: telegram-bot:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Define commit-addressed image name
        run: |
          set -euo pipefail
          image_repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPOSITORY=$image_repository" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${image_repository}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image once with BuildKit
        id: production-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: ${{ env.LOCAL_IMAGE_TAG }}
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image

      - name: Capture Docker build diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docker-diagnostics
          cat > docker-diagnostics/build-metadata.json <<'JSON'
          ${{ steps.production-build.outputs.metadata }}
          JSON
          docker buildx ls > docker-diagnostics/buildx.txt 2>&1 || true
          docker image inspect "$LOCAL_IMAGE_TAG" > docker-diagnostics/image-inspect.json 2>&1 || true
          docker history --no-trunc "$LOCAL_IMAGE_TAG" > docker-diagnostics/image-history.txt 2>&1 || true

      - name: Verify production container image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh -e APP_ENV=testing "$LOCAL_IMAGE_TAG" -ceu '
            php --version
            php artisan --version
            test -f vendor/autoload.php
            test -f public/build/manifest.json
            test -x /usr/local/bin/docker-entrypoint-laravel
            test -x /usr/local/bin/docker-scheduler-laravel
          '

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image and record immutable digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE_TAG" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          docker pull "$IMAGE_TAG"

          repository_digest="$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          digest="${repository_digest#*@}"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo "Registry returned an invalid image digest: $digest" >&2; exit 1; }

          immutable_ref="${IMAGE_REPOSITORY}@${digest}"
          printf '%s\n' "$digest" > production-image-digest.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=production-image \
            -f description="$digest" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### Production image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Immutable reference: \`${immutable_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published verified production image: $immutable_ref"

      - name: Upload Docker diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-failure-${{ github.run_attempt }}
          path: docker-diagnostics/
          if-no-files-found: warn
          retention-days: 14
