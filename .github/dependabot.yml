version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: composer
    directory: /src
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      frontend-toolchain:
        applies-to: version-updates
        patterns:
          - "@tailwindcss/*"
          - "concurrently"
          - "laravel-vite-plugin"
          - "tailwindcss"
          - "vite"
    open-pull-requests-limit: 5
