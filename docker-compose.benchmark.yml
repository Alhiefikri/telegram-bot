services:
  app:
    environment:
      APP_ALLOW_DOGFOOD_RUNTIME: "true"
      APP_AUTO_MIGRATE: "true"
      DOGFOOD_TIMING_ENABLED: ${DOGFOOD_TIMING_ENABLED:-true}
      DOGFOOD_TIMING_LOG_CHANNEL: ${DOGFOOD_TIMING_LOG_CHANNEL:-stderr}
      DOGFOOD_FAKE_TELEGRAM_OUTBOUND: ${DOGFOOD_FAKE_TELEGRAM_OUTBOUND:-true}
      DOGFOOD_FAKE_TELEGRAM_LATENCY_US: ${DOGFOOD_FAKE_TELEGRAM_LATENCY_US:-1000}
      DOGFOOD_ADMIN_EMAIL: ${DOGFOOD_ADMIN_EMAIL:-benchmark-owner@example.test}
      DOGFOOD_ADMIN_PASSWORD: ${DOGFOOD_ADMIN_PASSWORD:-BenchmarkPassword123!}
      DOGFOOD_TELEGRAM_PHOTO_FILE_ID: ${DOGFOOD_TELEGRAM_PHOTO_FILE_ID:-}
      DOGFOOD_STORE_CHANNEL_CHAT_ID: ${DOGFOOD_STORE_CHANNEL_CHAT_ID:-}
      DOGFOOD_STORE_CHANNEL_USERNAME: ${DOGFOOD_STORE_CHANNEL_USERNAME:-}
      DOGFOOD_STORE_CHANNEL_LINK: ${DOGFOOD_STORE_CHANNEL_LINK:-}
      DOGFOOD_STORE_CHANNEL_MEMBER_USER_ID: ${DOGFOOD_STORE_CHANNEL_MEMBER_USER_ID:-}
      DOGFOOD_STORE_CHANNEL_NON_MEMBER_USER_ID: ${DOGFOOD_STORE_CHANNEL_NON_MEMBER_USER_ID:-}
      DOGFOOD_TELEGRAM_CALLBACK_QUERY_ID: ${DOGFOOD_TELEGRAM_CALLBACK_QUERY_ID:-}

  scheduler:
    environment:
      APP_ALLOW_DOGFOOD_RUNTIME: "true"
      DOGFOOD_TIMING_ENABLED: ${DOGFOOD_TIMING_ENABLED:-true}
      DOGFOOD_TIMING_LOG_CHANNEL: ${DOGFOOD_TIMING_LOG_CHANNEL:-stderr}
      DOGFOOD_FAKE_TELEGRAM_OUTBOUND: ${DOGFOOD_FAKE_TELEGRAM_OUTBOUND:-true}
      DOGFOOD_FAKE_TELEGRAM_LATENCY_US: ${DOGFOOD_FAKE_TELEGRAM_LATENCY_US:-1000}
